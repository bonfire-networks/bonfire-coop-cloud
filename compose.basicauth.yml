version: "3.8"
services:
  app:
    secrets:
      - usersfile
    deploy:
      labels:
        - "traefik.http.middlewares.${STACK_NAME}_basicauth.basicauth.usersFile=/run/secrets/usersfile"
        - "traefik.http.routers.${STACK_NAME}.middlewares=${STACK_NAME}_basicauth"
        # the uploads router (see compose.yml) needs the basic auth too, or uploads would bypass it
        - "traefik.http.routers.${STACK_NAME}_uploads.middlewares=${STACK_NAME}_basicauth,${STACK_NAME}_uploads_csp"

secrets:
  usersfile:
    name: ${STACK_NAME}_usersfile_${SECRET_USERSFILE_VERSION}
    external: true